<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect x="25" y="35" width="150" height="120" rx="8" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <!-- Terminal header -->
  <line x1="25" y1="55" x2="175" y2="55" stroke="url(#grad1)" stroke-width="1.5"/>
  <!-- Window controls -->
  <circle cx="40" cy="45" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="55" cy="45" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="70" cy="45" r="4" fill="#6366f1" opacity="0.3"/>
  <!-- Code lines -->
  <g fill="none" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="72" x2="90" y2="72"/>
    <line x1="40" y1="88" x2="130" y2="88"/>
    <line x1="55" y1="104" x2="110" y2="104"/>
    <line x1="55" y1="120" x2="140" y2="120"/>
    <line x1="40" y1="136" x2="100" y2="136"/>
  </g>
  <!-- Code brackets -->
  <path d="M38 70 L33 80 L38 90" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M145 118 L150 128 L145 138" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Cursor blink -->
  <line x1="105" y1="132" x2="105" y2="140" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <!-- Prompt symbol -->
  <text x="35" y="76" font-size="10" fill="#6366f1" font-family="monospace" opacity="0.6">&gt;</text>
  <!-- Decorative code brackets in background -->
  <text x="140" y="30" font-size="12" fill="#6366f1" font-family="monospace" opacity="0.2">{ }</text>
  <text x="20" y="175" font-size="10" fill="#06b6d4" font-family="monospace" opacity="0.2">&lt;/&gt;</text>
</svg>