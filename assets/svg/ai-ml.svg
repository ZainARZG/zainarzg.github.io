<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Connections: Input to Hidden -->
  <g stroke="url(#grad1)" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="40" y1="50" x2="100" y2="40"/>
    <line x1="40" y1="50" x2="100" y2="75"/>
    <line x1="40" y1="50" x2="100" y2="110"/>
    <line x1="40" y1="50" x2="100" y2="145"/>
    <line x1="40" y1="90" x2="100" y2="40"/>
    <line x1="40" y1="90" x2="100" y2="75"/>
    <line x1="40" y1="90" x2="100" y2="110"/>
    <line x1="40" y1="90" x2="100" y2="145"/>
    <line x1="40" y1="130" x2="100" y2="40"/>
    <line x1="40" y1="130" x2="100" y2="75"/>
    <line x1="40" y1="130" x2="100" y2="110"/>
    <line x1="40" y1="130" x2="100" y2="145"/>
  </g>
  <!-- Connections: Hidden to Output -->
  <g stroke="url(#grad2)" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="100" y1="40" x2="160" y2="75"/>
    <line x1="100" y1="40" x2="160" y2="115"/>
    <line x1="100" y1="75" x2="160" y2="75"/>
    <line x1="100" y1="75" x2="160" y2="115"/>
    <line x1="100" y1="110" x2="160" y2="75"/>
    <line x1="100" y1="110" x2="160" y2="115"/>
    <line x1="100" y1="145" x2="160" y2="75"/>
    <line x1="100" y1="145" x2="160" y2="115"/>
  </g>
  <!-- Input layer nodes -->
  <g fill="url(#grad1)">
    <circle cx="40" cy="50" r="6"/>
    <circle cx="40" cy="90" r="6"/>
    <circle cx="40" cy="130" r="6"/>
  </g>
  <!-- Hidden layer nodes -->
  <g fill="url(#grad2)">
    <circle cx="100" cy="40" r="6"/>
    <circle cx="100" cy="75" r="6"/>
    <circle cx="100" cy="110" r="6"/>
    <circle cx="100" cy="145" r="6"/>
  </g>
  <!-- Output layer nodes -->
  <g fill="url(#grad1)">
    <circle cx="160" cy="75" r="6"/>
    <circle cx="160" cy="115" r="6"/>
  </g>
  <!-- Layer labels -->
  <text x="40" y="165" font-size="7" fill="#6366f1" text-anchor="middle" font-family="sans-serif">Input</text>
  <text x="100" y="165" font-size="7" fill="#06b6d4" text-anchor="middle" font-family="sans-serif">Hidden</text>
  <text x="160" y="165" font-size="7" fill="#6366f1" text-anchor="middle" font-family="sans-serif">Output</text>
</svg>