<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Open book/letter -->
  <path d="M40 50 Q40 45 50 45 L95 45 Q100 45 100 50 L100 155 Q100 160 95 160 L50 160 Q40 160 40 155Z" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M160 50 Q160 45 150 45 L105 45 Q100 45 100 50 L100 155 Q100 160 105 160 L150 160 Q160 160 160 155Z" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Spine -->
  <line x1="100" y1="45" x2="100" y2="160" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
  <!-- Text lines - left page -->
  <g fill="none" stroke="url(#grad2)" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="52" y1="65" x2="90" y2="65"/>
    <line x1="52" y1="80" x2="85" y2="80"/>
    <line x1="52" y1="95" x2="90" y2="95"/>
    <line x1="52" y1="110" x2="75" y2="110"/>
    <line x1="52" y1="125" x2="88" y2="125"/>
    <line x1="52" y1="140" x2="80" y2="140"/>
  </g>
  <!-- Text lines - right page -->
  <g fill="none" stroke="url(#grad2)" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="110" y1="65" x2="148" y2="65"/>
    <line x1="110" y1="80" x2="145" y2="80"/>
    <line x1="110" y1="95" x2="148" y2="95"/>
    <line x1="110" y1="110" x2="135" y2="110"/>
    <line x1="110" y1="125" x2="148" y2="125"/>
    <line x1="110" y1="140" x2="140" y2="140"/>
  </g>
  <!-- Pen -->
  <g transform="translate(145, 130) rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-2,40 2,40 0,50" fill="#6366f1"/>
    <rect x="-2" y="-5" width="4" height="8" rx="1" fill="#06b6d4"/>
  </g>
  <!-- Decorative elements -->
  <circle cx="30" cy="35" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="170" cy="35" r="3" fill="#06b6d4" opacity="0.3"/>
</svg>