<svg width="1200" height="840" viewBox="0 0 1200 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="840" rx="36" fill="#F3F7FD"/>
  <rect x="56" y="56" width="1088" height="728" rx="28" fill="#FFFFFF"/>
  <rect x="104" y="102" width="274" height="36" rx="18" fill="#E8F0FE"/>
  <text x="128" y="126" fill="#32598F" font-family="Arial, sans-serif" font-size="16" letter-spacing="2.4">WORKFLOW OVERVIEW</text>
  <text x="104" y="212" fill="#162134" font-family="Georgia, serif" font-size="56" font-weight="700">From dataset to model</text>
  <text x="104" y="274" fill="#4C617A" font-family="Arial, sans-serif" font-size="25">Prepared date-based records, engineered lag features, trained Random Forest regressors, and evaluated predictions.</text>
  <rect x="104" y="336" width="220" height="128" rx="24" fill="#EFF4FB" stroke="#D8E3F0"/>
  <text x="136" y="378" fill="#244968" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Prepare data</text>
  <text x="136" y="414" fill="#51677F" font-family="Arial, sans-serif" font-size="20">Historical weather dataset</text>
  <rect x="384" y="336" width="220" height="128" rx="24" fill="#EEF8F7" stroke="#D3ECE9"/>
  <text x="416" y="378" fill="#16655F" font-family="Arial, sans-serif" font-size="24" font-weight="700">2. Train models</text>
  <text x="416" y="414" fill="#51677F" font-family="Arial, sans-serif" font-size="20">Temperature and rainfall</text>
  <rect x="664" y="336" width="220" height="128" rx="24" fill="#FFF5E9" stroke="#F2DFC0"/>
  <text x="696" y="378" fill="#9C6310" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Evaluate</text>
  <text x="696" y="414" fill="#51677F" font-family="Arial, sans-serif" font-size="20">MAE, RMSE, and R2</text>
  <rect x="944" y="336" width="120" height="128" rx="24" fill="#EFF4FB" stroke="#D8E3F0"/>
  <text x="974" y="404" fill="#244968" font-family="Arial, sans-serif" font-size="46" font-weight="700">4</text>
  <text x="972" y="438" fill="#51677F" font-family="Arial, sans-serif" font-size="16">Save</text>
  <line x1="324" y1="400" x2="384" y2="400" stroke="#B5C8E1" stroke-width="8" stroke-linecap="round"/>
  <line x1="604" y1="400" x2="664" y2="400" stroke="#B5C8E1" stroke-width="8" stroke-linecap="round"/>
  <line x1="884" y1="400" x2="944" y2="400" stroke="#B5C8E1" stroke-width="8" stroke-linecap="round"/>
  <rect x="104" y="536" width="960" height="164" rx="28" fill="#F7FAFD" stroke="#D8E3F0"/>
  <polyline points="160,646 246,610 322,626 408,562 520,594 624,546 730,572 846,522 980,550" stroke="#285FC4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="588" fill="#244968" font-family="Arial, sans-serif" font-size="24" font-weight="700">Model workflow and evaluation</text>
  <text x="160" y="620" fill="#5C728A" font-family="Arial, sans-serif" font-size="20">Built as part of Programming Fundamentals with a focus on practical experimentation and readable analysis.</text>
