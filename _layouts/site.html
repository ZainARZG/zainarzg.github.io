<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#f4f7fb">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.body_class }}">
  {% assign current_nav = page.nav | default: page.layout %}
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-kicker">Syed Muhammad Zain</span>
        <span class="brand-title">Writing and Work</span>
      </a>

      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link{% if current_nav == 'home' %} is-active{% endif %}" href="{{ '/' | relative_url }}"{% if current_nav == 'home' %} aria-current="page"{% endif %}>Home</a>
          <a class="nav-link{% if current_nav == 'blog' or current_nav == 'post' %} is-active{% endif %}" href="{{ '/blog/' | relative_url }}"{% if current_nav == 'blog' or current_nav == 'post' %} aria-current="page"{% endif %}>Posts</a>
          <a class="nav-link{% if current_nav == 'about' %} is-active{% endif %}" href="{{ '/about/' | relative_url }}"{% if current_nav == 'about' %} aria-current="page"{% endif %}>About</a>
          <a class="nav-link{% if current_nav == 'contact' %} is-active{% endif %}" href="{{ '/contact/' | relative_url }}"{% if current_nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
        </nav>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false">
          <span class="theme-toggle-swatch" aria-hidden="true"></span>
          <span class="theme-toggle-label">Dark mode</span>
        </button>
      </div>
    </header>

    <main class="page" id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p class="footer-copy">Writing and ongoing work by Syed Muhammad Zain.</p>
      <div class="footer-links">
        <a href="mailto:ZAINMUAMMAD160@GMAIL.COM">Email</a>
        <a href="https://github.com/ZAINARZG">GitHub</a>
      </div>
    </footer>
  </div>
</body>
</html>
