title: "Syed Muhammad Zain"
author: "Syed Muhammad Zain"
description: "Personal site of Syed Muhammad Zain, featuring selected work and writing on software, systems, and learning in computer engineering."
url: "https://zainarzg.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Karachi"
permalink: /insights/:title/
excerpt_separator: "\n\n\n"
email: "ZAINMUAMMAD160@GMAIL.COM"
github_url: "https://github.com/ZAINARZG"
