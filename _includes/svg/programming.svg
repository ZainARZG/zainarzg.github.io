<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Code brackets -->
  <path d="M60 60 L40 100 L60 140" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 60 L160 100 L140 140" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Python-style code lines -->
  <g fill="none" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="75" y1="75" x2="100" y2="75"/>
    <line x1="75" y1="90" x2="125" y2="90"/>
    <line x1="85" y1="105" x2="115" y2="105"/>
    <line x1="75" y1="120" x2="110" y2="120"/>
  </g>
  <!-- Debug arrows -->
  <g fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <polyline points="50,165 65,155 80,165"/>
    <polyline points="120,165 135,155 150,165"/>
  </g>
  <!-- Python snake hint (subtle curve) -->
  <path d="M85 155 Q100 145 115 155 Q100 165 85 155Z" fill="none" stroke="url(#grad1)" stroke-width="1.5"/>
  <!-- Decorative dots -->
  <circle cx="45" cy="45" r="3" fill="#6366f1" opacity="0.4"/>
  <circle cx="155" cy="45" r="3" fill="#06b6d4" opacity="0.4"/>
  <circle cx="100" cy="35" r="3" fill="#6366f1" opacity="0.3"/>
</svg>