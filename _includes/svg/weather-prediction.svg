<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Grid lines -->
  <g stroke="#e5e7eb" stroke-width="0.5" fill="none">
    <line x1="30" y1="40" x2="30" y2="160"/>
    <line x1="30" y1="160" x2="170" y2="160"/>
    <line x1="30" y1="70" x2="170" y2="70"/>
    <line x1="30" y1="100" x2="170" y2="100"/>
    <line x1="30" y1="130" x2="170" y2="130"/>
    <line x1="65" y1="40" x2="65" y2="160"/>
    <line x1="100" y1="40" x2="100" y2="160"/>
    <line x1="135" y1="40" x2="135" y2="160"/>
    <line x1="170" y1="40" x2="170" y2="160"/>
  </g>
  <!-- Temperature curve -->
  <path d="M30 120 Q50 110 65 90 T100 60 T135 80 T170 50" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Precipitation bars -->
  <g fill="url(#grad2)" opacity="0.6">
    <rect x="40" y="130" width="12" height="30" rx="2"/>
    <rect x="75" y="110" width="12" height="50" rx="2"/>
    <rect x="110" y="140" width="12" height="20" rx="2"/>
    <rect x="145" y="120" width="12" height="40" rx="2"/>
  </g>
  <!-- Neural network nodes -->
  <g fill="url(#grad1)">
    <circle cx="50" cy="30" r="4"/>
    <circle cx="80" cy="25" r="4"/>
    <circle cx="110" cy="30" r="4"/>
    <circle cx="140" cy="25" r="4"/>
    <circle cx="65" cy="15" r="3"/>
    <circle cx="95" cy="12" r="3"/>
    <circle cx="125" cy="15" r="3"/>
  </g>
  <g stroke="url(#grad1)" stroke-width="0.8" fill="none" opacity="0.5">
    <line x1="50" y1="30" x2="65" y2="15"/>
    <line x1="50" y1="30" x2="95" y2="12"/>
    <line x1="80" y1="25" x2="65" y2="15"/>
    <line x1="80" y1="25" x2="95" y2="12"/>
    <line x1="80" y1="25" x2="125" y2="15"/>
    <line x1="110" y1="30" x2="95" y2="12"/>
    <line x1="110" y1="30" x2="125" y2="15"/>
    <line x1="140" y1="25" x2="125" y2="15"/>
  </g>
  <!-- Axis labels -->
  <text x="15" y="105" font-size="7" fill="#6366f1" font-family="sans-serif" transform="rotate(-90 15 105)">Value</text>
  <text x="95" y="178" font-size="7" fill="#6366f1" font-family="sans-serif" text-anchor="middle">Time</text>
</svg>