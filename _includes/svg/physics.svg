<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Electron orbits -->
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#grad1)" stroke-width="1.5" transform="rotate(0 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#grad2)" stroke-width="1.5" transform="rotate(60 100 100)"/>
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#grad1)" stroke-width="1.5" transform="rotate(120 100 100)"/>
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="12" fill="url(#grad1)"/>
  <circle cx="100" cy="100" r="8" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <!-- Electrons -->
  <circle cx="170" cy="100" r="4" fill="#06b6d4"/>
  <circle cx="65" cy="139" r="4" fill="#6366f1"/>
  <circle cx="135" cy="139" r="4" fill="#06b6d4"/>
  <!-- Energy waves -->
  <g fill="none" stroke="url(#grad1)" stroke-width="0.8" opacity="0.3">
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="45"/>
    <circle cx="100" cy="100" r="60"/>
  </g>
  <!-- Decorative particles -->
  <circle cx="30" cy="40" r="2" fill="#6366f1" opacity="0.4"/>
  <circle cx="170" cy="50" r="2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="40" cy="160" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="160" cy="155" r="2" fill="#6366f1" opacity="0.3"/>
</svg>