<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Dotted path -->
  <path d="M30 160 Q50 140 70 130 T110 100 T150 70 L170 50" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <!-- Start point -->
  <circle cx="30" cy="160" r="8" fill="none" stroke="#6366f1" stroke-width="2"/>
  <circle cx="30" cy="160" r="3" fill="#6366f1"/>
  <!-- End point -->
  <circle cx="170" cy="50" r="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="170" cy="50" r="3" fill="#06b6d4"/>
  <!-- Compass -->
  <g transform="translate(155, 155)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#grad2)" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="url(#grad2)" stroke-width="1"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="url(#grad2)" stroke-width="1"/>
    <polygon points="0,-12 -4,0 0,-4 4,0" fill="#6366f1"/>
    <text x="0" y="-16" font-size="6" fill="#6366f1" text-anchor="middle" font-family="sans-serif">N</text>
  </g>
  <!-- Milestone markers -->
  <circle cx="70" cy="130" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="110" cy="100" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="150" cy="70" r="3" fill="#06b6d4" opacity="0.5"/>
  <!-- Labels -->
  <text x="30" y="178" font-size="7" fill="#6366f1" text-anchor="middle" font-family="sans-serif">Start</text>
  <text x="170" y="42" font-size="7" fill="#06b6d4" text-anchor="middle" font-family="sans-serif">End</text>
</svg>