<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Train tracks -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.5">
    <line x1="20" y1="140" x2="180" y2="140"/>
    <line x1="20" y1="155" x2="180" y2="155"/>
  </g>
  <!-- Track ties -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.3">
    <line x1="35" y1="140" x2="35" y2="155"/>
    <line x1="55" y1="140" x2="55" y2="155"/>
    <line x1="75" y1="140" x2="75" y2="155"/>
    <line x1="95" y1="140" x2="95" y2="155"/>
    <line x1="115" y1="140" x2="115" y2="155"/>
    <line x1="135" y1="140" x2="135" y2="155"/>
    <line x1="155" y1="140" x2="155" y2="155"/>
    <line x1="175" y1="140" x2="175" y2="155"/>
  </g>
  <!-- Train -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="url(#grad1)"/>
    <rect x="5" y="5" width="15" height="12" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="25" y="5" width="15" height="12" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="45" y="5" width="10" height="12" rx="2" fill="#fff" opacity="0.6"/>
    <circle cx="15" cy="33" r="5" fill="#6366f1"/>
    <circle cx="45" cy="33" r="5" fill="#6366f1"/>
    <circle cx="15" cy="33" r="2" fill="#fff" opacity="0.5"/>
    <circle cx="45" cy="33" r="2" fill="#fff" opacity="0.5"/>
  </g>
  <!-- House -->
  <g transform="translate(140, 40)">
    <polygon points="20,0 0,20 40,20" fill="none" stroke="url(#grad2)" stroke-width="2" stroke-linejoin="round"/>
    <rect x="5" y="20" width="30" height="25" fill="none" stroke="url(#grad2)" stroke-width="2"/>
    <rect x="15" y="30" width="10" height="15" fill="none" stroke="url(#grad2)" stroke-width="1.5"/>
  </g>
  <!-- Heart -->
  <path d="M100 55 C100 48 90 45 90 52 C90 60 100 68 100 68 C100 68 110 60 110 52 C110 45 100 48 100 55Z" fill="url(#grad1)" opacity="0.8"/>
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="50" cy="35" r="2" fill="#06b6d4" opacity="0.3"/>
</svg>